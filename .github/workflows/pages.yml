name: Refresh hotspots and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Once per day. GitHub schedules may start a little later during busy periods.
    - cron: '17 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore last successful cache
        uses: actions/cache@v4
        with:
          path: data/hotspots.json
          key: hotspots-${{ github.run_id }}
          restore-keys: |
            hotspots-

      - name: Refresh hotspots
        run: npm run refresh

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
