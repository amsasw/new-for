name: Refresh hotspots and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Once per day. GitHub may delay scheduled jobs slightly during busy periods.
    - cron: '17 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore last successful cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/hotspots.json
          key: hotspots-${{ github.run_id }}
          restore-keys: |
            hotspots-

      - name: Refresh hotspots
        if: github.event_name != 'push'
        run: npm run refresh

      - name: Save refreshed cache
        if: github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: data/hotspots.json
          key: hotspots-${{ github.run_id }}

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
