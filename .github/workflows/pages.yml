name: Refresh country tech feeds and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Once per day. GitHub may delay scheduled jobs slightly during busy periods.
    - cron: '17 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore last successful cache
        uses: actions/cache/restore@v4
        with:
          path: data/hotspots.json
          key: country-tech-${{ github.run_id }}
          restore-keys: |
            country-tech-
            country-news-
            hotspots-

      - name: Check whether cache migration is required
        id: schema
        shell: bash
        run: |
          VERSION="$(node -e "try{const j=require('./data/hotspots.json');process.stdout.write(String(j.meta?.schemaVersion||0))}catch{process.stdout.write('0')}")"
          if [ "$VERSION" != "3" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh country tech feeds
        if: github.event_name != 'push' || steps.schema.outputs.refresh == 'true'
        run: npm run refresh

      - name: Save refreshed cache
        if: github.event_name != 'push' || steps.schema.outputs.refresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/hotspots.json
          key: country-tech-${{ github.run_id }}

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
